[project]
name = "elf"
version = "1.2.0"
description = "Advent of Code helper for Python: fetch and cache inputs, submit answers, and pull private leaderboards."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "cak", email = "cak@typeerror.com" }
]
requires-python = ">=3.11"

dependencies = [
    "beautifulsoup4>=4.14.2",
    "httpx>=0.28.1",
    "pydantic>=2.12.4",
    "rich>=14.2.0",
    "typer>=0.20.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

keywords = [
    "advent of code",
    "aoc",
    "cli",
    "python",
    "puzzles",
]

classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/snally-dev/elf"
Documentation = "https://snally.com/elf/"
Repository = "https://github.com/snally-dev/elf"
Issue-Tracker = "https://github.com/snally-dev/elf/issues"
Changelog = "https://github.com/snally-dev/elf/blob/main/CHANGELOG.md"

[project.scripts]
elf = "elf.cli:main"

[tool.setuptools.packages.find]
include = ["elf*"]

[tool.setuptools.package-data]
elf = ["py.typed", "templates/*.py"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "great-docs>=0.17.0",
    "mypy>=1.19.0",
    "pytest>=9.0.1",
    "ruff>=0.14.0",
]

[tool.mypy]
files = ["elf"]
python_version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "BLE", "E", "F", "I", "PYI", "RUF012", "RUF022", "SIM", "UP"]
ignore = ["UP042"]

name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --locked --group dev

      - name: Test
        run: uv run pytest -q

      - name: Smoke-test diagnostics
        run: uv run elf doctor

      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run ruff check elf tests

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run ruff format --check elf tests

      - name: Type check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run mypy

      - name: Build distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv build
